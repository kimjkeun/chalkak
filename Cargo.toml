[package]
name = "capture_tool"
version = "0.1.0"
edition = "2024"

[dependencies]
ab_glyph = "0.2.32"
anyhow = "1"
arboard = "3.7.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
global-hotkey = "0.10.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1.0.229", features = ["derive"] }
softbuffer = "0.4.8"
toml = "1.2.1"
tray-icon = "0.26.1"
windows = { version = "0.62", features = ["Media_Ocr", "Graphics_Imaging", "Storage_Streams", "Foundation", "Globalization"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_HiDpi", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
winit = "0.30.13"
winreg = "0.56.0"
xcap = "0.9.10"
