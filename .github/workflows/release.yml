# v로 시작하는 태그(예: v0.1.0)를 올리면 Windows용 실행 파일을 빌드해 릴리스에 붙인다.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 준비
        run: rustup update stable --no-self-update && rustup default stable

      - name: 빌드
        run: cargo build --release --locked

      - name: 압축 파일 만들기
        shell: pwsh
        run: |
          $name = "chalkak-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          Copy-Item target/release/chalkak.exe, target/release/chalkak_tray.exe, README.md $name
          Compress-Archive -Path $name -DestinationPath "$name.zip"

      - name: 릴리스 만들기
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" "chalkak-${{ github.ref_name }}-windows-x64.zip" --title "찰칵 ${{ github.ref_name }}" --generate-notes
